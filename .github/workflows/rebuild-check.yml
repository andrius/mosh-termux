name: rebuild-check

# Termux rebuilds mosh (new revision) whenever abseil-cpp or protobuf change
# ABI. Our patched package is built from the official recipe plus ".1", so it
# goes stale and breaks at link time. Detect that and cut a new release tag.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: compare official recipe with latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          b=$(curl -fsS https://raw.githubusercontent.com/termux/termux-packages/master/packages/mosh/build.sh)
          ver=$(sed -n 's/^TERMUX_PKG_VERSION=//p' <<<"$b" | tr -d '"' | head -1)
          rev=$(sed -n 's/^TERMUX_PKG_REVISION=//p' <<<"$b" | tr -d '"' | head -1)
          want="${ver}-${rev:-0}.1"
          echo "official recipe -> we should ship mosh_${want}"
          have=$(gh release view --json assets --jq '.assets[].name' 2>/dev/null | grep -m1 '_aarch64.deb' || true)
          echo "latest release asset: ${have:-none}"
          if [ "$have" = "mosh_${want}_aarch64.deb" ]; then
            echo "up to date"; exit 0
          fi
          n=$(git tag -l "v${ver}-mouse*" | sed 's/.*mouse//' | sort -n | tail -1)
          tag="v${ver}-mouse$(( ${n:-0} + 1 ))"
          echo "cutting $tag"
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git tag -a "$tag" -m "Auto-rebuild against official Termux mosh ${ver}-${rev}"
          git push origin "$tag"
          # Pushes made with GITHUB_TOKEN do not trigger workflows; dispatch does.
          gh workflow run ci.yml --ref "$tag"
