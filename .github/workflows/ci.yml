name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TERMUX_ARCHES: aarch64 arm i686 x86_64

jobs:
  patch-applies:
    name: patch applies to upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify the upstream tarball
        run: |
          curl -LfsS -o mosh.tar.gz \
            https://github.com/mobile-shell/mosh/releases/download/mosh-1.4.0/mosh-1.4.0.tar.gz
          echo "872e4b134e5df29c8933dff12350785054d2fd2839b5ae6b5587b14db1465ddd  mosh.tar.gz" | sha256sum -c -
          tar xf mosh.tar.gz
      - name: dry-run the patch
        run: patch -p1 --dry-run -d mosh-1.4.0 < patches/0001-terminaldisplay-replay-nested-mouse-modes.patch

  behaviour:
    name: stock fails, patched passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            mosh build-essential pkg-config protobuf-compiler libprotobuf-dev \
            libssl-dev libncurses-dev zlib1g-dev tmux

      # verify.sh drives a real mosh-client, so it needs a pty with a nonzero
      # size. A CI runner has no tty at all; tmux gives it one.
      - name: stock mosh-client must FAIL
        run: |
          tmux new-session -d -x 80 -y 24 \
            'bash verify.sh mosh-client > /tmp/stock.txt 2>&1; echo $? > /tmp/stock.rc'
          for _ in $(seq 60); do [ -f /tmp/stock.rc ] && break; sleep 1; done
          cat /tmp/stock.txt
          grep -q FAIL /tmp/stock.txt

      - name: build the patched client
        run: bash build.sh

      - name: patched mosh-client must PASS
        run: |
          BIN="$HOME/.cache/mosh-termux/mosh-1.4.0/src/frontend/mosh-client"
          tmux new-session -d -x 80 -y 24 \
            "bash verify.sh $BIN > /tmp/patched.txt 2>&1; echo \$? > /tmp/patched.rc"
          for _ in $(seq 60); do [ -f /tmp/patched.rc ] && break; sleep 1; done
          cat /tmp/patched.txt
          grep -q PASS /tmp/patched.txt

  packages:
    name: deb (${{ matrix.arch }})
    # Heavy: pulls the Termux builder image. Only on demand and on tags.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [patch-applies]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, arm, x86_64, i686]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          path: termux-packages
          fetch-depth: 1

      # termux_step_patch_package applies every *.patch in the package
      # directory, so dropping ours in is the whole integration. The revision
      # suffix is what makes apt see an upgrade over the official package;
      # without it our build has an identical version string and is ignored.
      - name: graft the patch and bump the revision
        run: |
          cp patches/*.patch termux-packages/packages/mosh/
          b=termux-packages/packages/mosh/build.sh
          rev=$(sed -n 's/^TERMUX_PKG_REVISION=//p' "$b" | tr -d '"' | head -1)
          rev=${rev:-0}
          if grep -q '^TERMUX_PKG_REVISION=' "$b"; then
            sed -i "s/^TERMUX_PKG_REVISION=.*/TERMUX_PKG_REVISION=${rev}.1/" "$b"
          else
            printf 'TERMUX_PKG_REVISION=%s\n' "${rev}.1" >> "$b"
          fi
          grep -E '^TERMUX_PKG_(VERSION|REVISION)=' "$b"

      - name: build
        working-directory: termux-packages
        run: ./scripts/run-docker.sh ./build-package.sh -a ${{ matrix.arch }} -I mosh

      - name: collect
        run: |
          mkdir -p debs
          find termux-packages/output -name "*.deb" -exec cp {} debs/ \;
          ls -l debs/

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: debs/*.deb
          if-no-files-found: error

  apt-repo:
    # Both the apt repository and its landing page are served from Pages, so
    # there is exactly one URL to document and one thing to keep current.
    name: publish apt repo
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [behaviour, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: debs
          merge-multiple: true
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends apt-utils

      - name: lay out the pool
        run: |
          mkdir -p repo/dists/stable/main
          for arch in $TERMUX_ARCHES; do
            mkdir -p "repo/pool/main/$arch" "repo/dists/stable/main/binary-$arch"
            # Termux uses its own architecture names, which are exactly the
            # suffixes termux-packages puts on the .deb files.
            find debs -name "*_${arch}.deb" -exec cp {} "repo/pool/main/$arch/" \;
            ls "repo/pool/main/$arch"
          done

      - name: index
        working-directory: repo
        run: |
          for arch in $TERMUX_ARCHES; do
            apt-ftparchive packages "pool/main/$arch" > "dists/stable/main/binary-$arch/Packages"
            gzip -9nk "dists/stable/main/binary-$arch/Packages"
          done
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=mosh-termux \
            -o APT::FTPArchive::Release::Label=mosh-termux \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Components=main \
            -o APT::FTPArchive::Release::Architectures="$TERMUX_ARCHES" \
            release dists/stable > dists/stable/Release

      - name: sign
        env:
          APT_SIGN_KEY: ${{ secrets.APT_SIGN_KEY }}
        working-directory: repo
        run: |
          GNUPGHOME=$(mktemp -d); export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          printf '%s' "$APT_SIGN_KEY" | gpg --batch --quiet --import
          gpg --batch --yes --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes --detach-sign --armor -o dists/stable/Release.gpg dists/stable/Release
          gpgconf --kill all
          rm -rf "$GNUPGHOME"
          test -s dists/stable/InRelease

      - name: landing page and key
        run: |
          # Pages would otherwise run the tree through Jekyll and drop the
          # dists/ and pool/ layout apt depends on.
          touch repo/.nojekyll
          cp keys/mosh-termux.gpg repo/
          cat > repo/index.html <<'HTML'
          <!doctype html><meta charset=utf-8>
          <meta name=viewport content="width=device-width,initial-scale=1">
          <title>mosh-termux apt repo</title>
          <style>
          :root{color-scheme:light dark}
          body{font:16px/1.6 system-ui,sans-serif;max-width:44em;margin:3em auto;padding:0 1.2em}
          pre{background:#8881;padding:1em;overflow-x:auto;border-radius:6px}
          code{font-size:.95em}
          </style>
          <h1>mosh-termux</h1>
          <p>A Termux apt repository carrying a patched <code>mosh</code> that restores
          mouse reporting for crossterm TUIs such as zellij. Over plain ssh the mouse
          works; over stock mosh it does not, because mosh collapses the mouse-mode
          request burst to a single mode that Termux does not implement.</p>
          <p>Source, measurements and rationale:
          <a href="https://github.com/andrius/mosh-termux">github.com/andrius/mosh-termux</a>.
          Upstream bug:
          <a href="https://github.com/mobile-shell/mosh/issues/1364">mosh#1364</a>.</p>
          <h2>Install</h2>
          <pre>curl -fsSL https://andrius.github.io/mosh-termux/mosh-termux.gpg \
            -o $PREFIX/etc/apt/trusted.gpg.d/mosh-termux.gpg
          echo "deb [signed-by=$PREFIX/etc/apt/trusted.gpg.d/mosh-termux.gpg] \
            https://andrius.github.io/mosh-termux stable main" \
            &gt; $PREFIX/etc/apt/sources.list.d/mosh-termux.list
          pkg update &amp;&amp; pkg install mosh</pre>
          <p>Signed with key
          <code>683C B53B C7FD A175 571D D268 9D26 0699 36D0 F390</code>,
          built for aarch64, arm, i686 and x86_64 in the official Termux builder
          image.</p>
          HTML

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: repo
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [behaviour, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: debs
          merge-multiple: true
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l debs/
          gh release create "${GITHUB_REF_NAME}" debs/*.deb \
            --title "${GITHUB_REF_NAME}" \
            --notes "Patched mosh for Termux: restores mouse reporting for crossterm TUIs.

          The easy path is the apt repository, which keeps itself updated. See
          the README for the three commands that add it.

          Or grab the .deb for your architecture below and \`dpkg -i\` it;
          \`dpkg --print-architecture\` tells you which one.

          Then prove it from a real Termux session with \`bash verify.sh\`, which
          must print \`1000h 1002h 1003h 1006h\` and PASS.

          Upstream: mosh#1364."
